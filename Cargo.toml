[package]
name = "syncd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "syncd"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
csv = "1"
socket2 = "0.6"
chacha20poly1305 = "0.10"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
