# Test rig: three devices on the real tailnet plus one observer.
#
# The three nodes don't know about each other via configuration: no
# --bootstrap, no address written down anywhere. They find each other by
# querying tailscaled and filtering by hostname prefix.
#
# Needs an ephemeral TS_AUTHKEY (Admin console, Settings, Keys):
# check Ephemeral, so nodes disappear from the tailnet when you stop
# the compose stack, and Reusable, since three containers share it.

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile
  environment: &node-env
    TS_AUTHKEY: "${TS_AUTHKEY:?an auth key is required, copy env.example to .env}"
    SYNCD_PORT: "47100"
    TS_USERSPACE: "true"
  cap_add: [NET_ADMIN, NET_RAW]
  devices: ["/dev/net/tun:/dev/net/tun"]
  networks: [bench]
  restart: on-failure:5
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:47100/v1/node"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 20s

services:

  device-a:
    <<: *node
    container_name: syncd-device-a
    hostname: syncd-a
    environment:
      <<: *node-env
      TS_HOSTNAME: syncd-a
    command:
      - syncd
      - --device=device-a
      - --port=47100
      - --peer-prefix=syncd-          # only probe this rig's own nodes
      - --interval=3
      - --telemetry=http://logger:9000/ev
      - --data=/data
    volumes: ["data-a:/data"]
    ports: ["47101:47100"]

  device-b:
    <<: *node
    container_name: syncd-device-b
    hostname: syncd-b
    environment:
      <<: *node-env
      TS_HOSTNAME: syncd-b
    command:
      - syncd
      - --device=device-b
      - --port=47100
      - --peer-prefix=syncd-
      - --interval=3
      - --telemetry=http://logger:9000/ev
      - --data=/data
    volumes: ["data-b:/data"]
    ports: ["47102:47100"]

  device-c:
    <<: *node
    container_name: syncd-device-c
    hostname: syncd-c
    environment:
      <<: *node-env
      TS_HOSTNAME: syncd-c
    command:
      - syncd
      - --device=device-c
      - --port=47100
      - --peer-prefix=syncd-
      - --interval=3
      - --telemetry=http://logger:9000/ev
      - --data=/data
    volumes: ["data-c:/data"]
    ports: ["47103:47100"]

  # The observer. No TS_AUTHKEY: it doesn't join the tailnet and isn't a
  # peer. It reaches the nodes over the Docker network, i.e. outside the
  # sync path. Stopping it doesn't stop the three nodes from syncing: the
  # test scenario checks this explicitly.
  logger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncd-logger
    command: ["logger"]
    environment:
      DEVICES: "device-a:47100,device-b:47100,device-c:47100"
      PORT: "9000"
    ports: ["9000:9000"]
    networks: [bench]
    restart: unless-stopped

networks:
  bench:
    driver: bridge

volumes:
  data-a:
  data-b:
  data-c:
